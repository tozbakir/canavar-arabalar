<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Canavar Arabalar">
  <meta name="theme-color" content="#0b162c">
  <title>Canavar Arabalar: #75 &amp; #18 Mavi Rampa Macerası</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" aria-label="Canavar Arabalar Mavi Rampa Atlama Oyunu"></canvas>

    <!-- Üst Bilgi ve Tek Dokunuş Kontrol Çubuğu -->
    <header id="hud-top">
      <!-- Sol: Canlı Telemetri ve Skor Rozetleri -->
      <div class="hud-stats">
        <div id="pill-stars" class="stat-pill star-pill">
          <span class="stat-svg-wrap" aria-hidden="true">
            <svg viewBox="0 0 48 48" class="svg-icon" aria-hidden="true">
              <polygon points="24,3 30.5,16 45,18.2 34.5,28.4 37,43 24,36 11,43 13.5,28.4 3,18.2 17.5,16"
                fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
              <polygon points="24,3 30.5,16 45,18.2 34.5,28.4 37,43 24,36 11,43 13.5,28.4 3,18.2 17.5,16"
                fill="#ffc800" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>
              <polygon points="24,8 28.5,17 38,18.5 31,25 32.8,35 24,30" fill="#fff3a1" opacity="0.75"/>
            </svg>
          </span>
          <div class="stat-content">
            <span id="stat-stars" class="stat-value">0</span>
            <small class="stat-unit">YILDIZ</small>
          </div>
        </div>

        <div id="pill-flips" class="stat-pill flip-pill">
          <span class="stat-svg-wrap" aria-hidden="true">
            <svg viewBox="0 0 48 48" class="svg-icon" aria-hidden="true">
              <g stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <path d="M 9 25 A 15 15 0 1 1 34 36"/>
                <polygon points="36,23 44,37 28,38" fill="#ffffff"/>
              </g>
              <path d="M 9 25 A 15 15 0 1 1 34 36" fill="none" stroke="#003566" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M 9 25 A 15 15 0 1 1 34 36" fill="none" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>
              <polygon points="36,23 44,37 28,38" fill="#ffbe0b" stroke="#9a3412" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="24" cy="24" r="5.5" fill="#ff5400" stroke="#ffffff" stroke-width="2.2"/>
            </svg>
          </span>
          <div class="stat-content">
            <span id="stat-flips" class="stat-value">0</span>
            <small class="stat-unit">TAKLA</small>
          </div>
        </div>

        <div class="stat-pill speed-pill">
          <span class="stat-svg-wrap" aria-hidden="true">
            <svg viewBox="0 0 48 48" class="svg-icon" aria-hidden="true">
              <polygon points="28,3 9,26 23,26 18,45 39,20 25,20"
                fill="#ffffff" stroke="#ffffff" stroke-width="5.5" stroke-linejoin="round"/>
              <polygon points="28,3 9,26 23,26 18,45 39,20 25,20"
                fill="#ffea00" stroke="#9a3412" stroke-width="2.4" stroke-linejoin="round"/>
              <polygon points="26,9 14,24 23,24 20,37 33,22 24,22" fill="#ffffff" opacity="0.65"/>
            </svg>
          </span>
          <div class="stat-content">
            <span id="stat-speed" class="stat-value">0</span>
            <small class="stat-unit">KM/S</small>
          </div>
        </div>
      </div>

      <!-- Sağ: Tek Dokunuşla #75 / #18 Araç Seçici, Rampa ve Oyun Kontrolleri -->
      <div class="hud-actions">
        <button id="btn-switch-truck" class="hud-btn truck-switch-btn active-green" type="button">
          <span class="visually-hidden">Araba Seç: </span>
          <span class="truck-badge badge-75" data-truck="green75">
            <svg viewBox="0 0 56 36" class="mini-truck-svg" aria-hidden="true">
              <path d="M 6 22 L 10 11 L 20 10 L 26 4 L 42 4 L 50 12 L 52 22 Z" fill="#4ec925" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M 27 7 L 39 7 L 44 13 L 24 13 Z" fill="#1e293b"/>
              <path d="M 30 14 Q 38 12 46 17 Q 38 20 30 18 Z" fill="#ff9f1c"/>
              <circle cx="16" cy="25" r="8.5" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
              <circle cx="16" cy="25" r="4.2" fill="#e61919"/>
              <circle cx="41" cy="25" r="8.5" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
              <circle cx="41" cy="25" r="4.2" fill="#e61919"/>
            </svg>
            <span class="badge-text">#75</span>
          </span>

          <span class="switch-icon" aria-hidden="true">
            <svg viewBox="0 0 28 28" class="svg-icon" aria-hidden="true">
              <path d="M 6 10 L 22 10 M 17 5 L 22 10 L 17 15 M 22 18 L 6 18 M 11 13 L 6 18 L 11 23"
                fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>

          <span class="truck-badge badge-18" data-truck="red18">
            <svg viewBox="0 0 56 36" class="mini-truck-svg" aria-hidden="true">
              <path d="M 6 22 L 8 12 L 22 12 L 27 4 L 42 4 L 50 12 L 52 22 Z" fill="#e61919" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M 28 7 L 39 7 L 44 13 L 25 13 Z" fill="#1e293b"/>
              <path d="M 14 14 L 46 14 L 44 18 L 12 18 Z" fill="#ffffff"/>
              <circle cx="16" cy="25" r="8.5" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
              <circle cx="16" cy="25" r="4.2" fill="#0077ff"/>
              <circle cx="41" cy="25" r="8.5" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
              <circle cx="41" cy="25" r="4.2" fill="#0077ff"/>
            </svg>
            <span class="badge-text">#18</span>
          </span>
        </button>

        <button id="btn-hud-ramp" class="hud-btn hud-ramp-btn" type="button">
          <span class="hud-btn-svg" aria-hidden="true">
            <svg viewBox="0 0 48 38" class="svg-icon" aria-hidden="true">
              <path d="M 4 33 Q 22 30 40 7 L 42 33 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
              <path d="M 4 33 Q 22 30 40 7 L 42 33 Z" fill="#003566" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M 8 31 Q 23 28 38 11 L 39 21 Q 24 31 8 31 Z" fill="#00bbf9"/>
              <polygon points="17,27 25,20 27,26" fill="#ffea00"/>
              <polygon points="27,19 36,10 38,18" fill="#ff9f1c"/>
              <polygon points="34,4 45,3 42,13" fill="#ffea00" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          </span>
          <span id="ramp-label" class="hud-btn-label">RAMPA!</span>
        </button>

        <button id="btn-buddy-mode" class="hud-btn buddy-btn is-on" type="button" aria-pressed="true">
          <span class="hud-btn-svg" aria-hidden="true">
            <svg viewBox="0 0 46 36" class="svg-icon" aria-hidden="true">
              <line x1="8" y1="5" x2="8" y2="32" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round"/>
              <path d="M 8 6 L 38 10 L 33 19 L 38 26 L 8 23 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
              <polygon points="10,8 20,9.5 20,15.5 10,14" fill="#0f172a"/>
              <polygon points="20,15.5 30,17 30,23 20,21.5" fill="#0f172a"/>
              <polygon points="30,10.5 36,11.5 33,17 30,16.5" fill="#0f172a"/>
            </svg>
          </span>
          <span id="buddy-label" class="hud-btn-label">2 ARABA: AÇIK</span>
        </button>

        <button id="btn-sound" class="hud-btn icon-btn" type="button" aria-pressed="true" aria-label="Sesi Aç veya Kapat">
          <span id="sound-icon" class="hud-icon-svg" aria-hidden="true">
            <svg viewBox="0 0 48 48" class="svg-icon svg-sound-on" aria-hidden="true">
              <polygon points="8,18 17,18 27,9 27,39 17,30 8,30" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
              <path d="M 33 16 Q 40 24 33 32" fill="none" stroke="#fde047" stroke-width="4.2" stroke-linecap="round"/>
              <path d="M 38 10 Q 47 24 38 38" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round"/>
            </svg>
            <svg viewBox="0 0 48 48" class="svg-icon svg-sound-off" aria-hidden="true">
              <polygon points="8,18 17,18 27,9 27,39 17,30 8,30" fill="#cbd5e1" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
              <line x1="33" y1="17" x2="43" y2="31" stroke="#ff4757" stroke-width="5" stroke-linecap="round"/>
              <line x1="43" y1="17" x2="33" y2="31" stroke="#ff4757" stroke-width="5" stroke-linecap="round"/>
            </svg>
          </span>
        </button>

        <button id="btn-pause" class="hud-btn icon-btn pause-btn" type="button" aria-label="Garajı Aç ve Oyunu Durdur">
          <span id="pause-icon" class="hud-icon-svg" aria-hidden="true">
            <svg viewBox="0 0 48 48" class="svg-icon" aria-hidden="true">
              <rect x="12" y="10" width="9" height="28" rx="4" fill="#ffffff" stroke="#7c2d12" stroke-width="1.5"/>
              <rect x="27" y="10" width="9" height="28" rx="4" fill="#ffffff" stroke="#7c2d12" stroke-width="1.5"/>
            </svg>
          </span>
        </button>
      </div>
    </header>

    <!-- Havada Takla / Süper Atlama Bildirim Banner'ı -->
    <div id="stunt-banner" class="stunt-banner" aria-live="polite">
      <span class="stunt-banner-svg" aria-hidden="true">
        <svg viewBox="0 0 48 48" class="svg-icon" aria-hidden="true">
          <polygon points="24,2 30.8,15.5 46,17.8 35,28.4 37.6,43.5 24,36.2 10.4,43.5 13,28.4 2,17.8 17.2,15.5"
            fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
          <polygon points="24,2 30.8,15.5 46,17.8 35,28.4 37.6,43.5 24,36.2 10.4,43.5 13,28.4 2,17.8 17.2,15.5"
            fill="#ffe600" stroke="#b45309" stroke-width="2.2" stroke-linejoin="round"/>
          <polygon points="24,8 28.5,17 38,18.5 31,25 32.8,35 24,30" fill="#fffbeb" opacity="0.8"/>
        </svg>
      </span>
      <span id="stunt-banner-text"></span>
    </div>

    <!-- Alt Ergonomik iPad Dokunmatik Kontrolleri (Çocuk Dostu 3B Arcade Butonlar) -->
    <footer id="controls-bottom">
      <!-- Sol El: Geri/Takla, Zıpla ve Korna -->
      <div class="control-cluster cluster-left">
        <button id="btn-brake" class="ctrl-btn btn-brake" type="button" data-action="brake">
          <span class="ctrl-svg-wrap" aria-hidden="true">
            <svg viewBox="0 0 92 68" class="svg-icon" aria-hidden="true">
              <!-- Beyaz Sticker Dış Kontur -->
              <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <path d="M 66 54 A 24 24 0 1 0 22 24"/>
                <polygon points="9,23 23,7 32,25" fill="#ffffff"/>
              </g>
              <!-- Ters Takla Dönüş Yayı -->
              <path d="M 66 54 A 24 24 0 1 0 22 24" fill="none" stroke="#7f1d1d" stroke-width="9" stroke-linecap="round"/>
              <path d="M 66 54 A 24 24 0 1 0 22 24" fill="none" stroke="#ffea00" stroke-width="5.5" stroke-linecap="round"/>
              <polygon points="9,23 23,7 32,25" fill="#ffea00" stroke="#7f1d1d" stroke-width="2" stroke-linejoin="round"/>
              <!-- Merkezde Temiz Geri Ok İşareti -->
              <polyline points="50,27 39,37 50,47" fill="none" stroke="#7f1d1d" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="50,27 39,37 50,47" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="ctrl-label">GERİ / TAKLA</span>
        </button>

        <div class="sub-cluster">
          <button id="btn-jump" class="ctrl-btn btn-jump" type="button" data-action="jump">
            <span class="ctrl-svg-wrap sub-svg-wrap" aria-hidden="true">
              <svg viewBox="0 0 60 60" class="svg-icon" aria-hidden="true">
                <!-- Beyaz Sticker Kontur -->
                <polygon points="30,3 51,23 39,23 39,34 21,34 21,23 9,23"
                  fill="#ffffff" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round"/>
                <!-- Yukarı Fırlatma Oku -->
                <polygon points="30,3 51,23 39,23 39,34 21,34 21,23 9,23"
                  fill="#ffea00" stroke="#b45309" stroke-width="2.2" stroke-linejoin="round"/>
                <polygon points="30,7 44,21 35,21 35,31 25,31 25,21 16,21" fill="#fef08a" opacity="0.7"/>
                <!-- Net Ayrışan Helezon Yay Halkaları -->
                <rect x="14" y="40" width="32" height="6" rx="3" fill="#ffffff" stroke="#003566" stroke-width="2.2"/>
                <rect x="18" y="49" width="24" height="6" rx="3" fill="#e0f2fe" stroke="#003566" stroke-width="2.2"/>
              </svg>
            </span>
            <span class="ctrl-label">ZIPLA!</span>
          </button>

          <button id="btn-horn" class="ctrl-btn btn-horn" type="button" data-action="horn">
            <span class="ctrl-svg-wrap sub-svg-wrap" aria-hidden="true">
              <svg viewBox="0 0 64 56" class="svg-icon" aria-hidden="true">
                <!-- Beyaz Sticker Kontur -->
                <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff">
                  <circle cx="13" cy="29" r="9.5"/>
                  <path d="M 20 24 L 46 10 L 46 46 L 20 34 Z"/>
                </g>
                <!-- Havalı Korna Gövdesi -->
                <path d="M 20 24 L 46 10 L 46 46 L 20 34 Z" fill="#e63946" stroke="#9b111e" stroke-width="2" stroke-linejoin="round"/>
                <path d="M 22 25 L 44 14 L 44 23 L 22 29 Z" fill="#ff8fa3" opacity="0.75"/>
                <ellipse cx="46" cy="28" rx="4.2" ry="16" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
                <circle cx="13" cy="29" r="9.5" fill="#00bbf9" stroke="#0077b6" stroke-width="2"/>
                <circle cx="11" cy="26" r="3.2" fill="#ffffff" opacity="0.85"/>
                <!-- Ses Dalgaları -->
                <path d="M 53 18 Q 60 28 53 38" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round"/>
                <path d="M 58 12 Q 66 28 58 44" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="ctrl-label">KORNA!</span>
          </button>
        </div>
      </div>

      <!-- Sağ El: Nitro Roket ve Dev Gaz Pedalı -->
      <div class="control-cluster cluster-right">
        <button id="btn-nitro" class="ctrl-btn btn-nitro" type="button" data-action="nitro">
          <span class="ctrl-svg-wrap" aria-hidden="true">
            <svg viewBox="0 0 84 68" class="svg-icon nitro-svg" aria-hidden="true">
              <!-- Beyaz Sticker Kontur -->
              <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff">
                <path d="M 26 24 C 42 6, 66 6, 78 20 C 68 40, 44 48, 28 38 Z"/>
                <polygon points="33,18 19,6 22,25"/>
                <polygon points="35,38 22,52 18,36"/>
                <path d="M 24 28 Q 6 22 3 36 Q 12 46 26 36 Z"/>
              </g>
              <!-- Roket Kanatçıkları -->
              <polygon points="33,18 19,6 22,25" fill="#ff0055" stroke="#88002b" stroke-width="1.5" stroke-linejoin="round"/>
              <polygon points="35,38 22,52 18,36" fill="#ff0055" stroke="#88002b" stroke-width="1.5" stroke-linejoin="round"/>
              <!-- Turbo Alev Kuyruğu -->
              <path d="M 26 26 Q 4 20 2 38 Q 14 48 28 36 Z" fill="#ff7b00" class="flame-tail"/>
              <path d="M 26 29 Q 12 25 9 36 Q 17 41 27 34 Z" fill="#ffea00" class="flame-tail"/>
              <!-- Roket Ana Gövde -->
              <path d="M 26 24 C 42 6, 66 6, 78 20 C 68 40, 44 48, 28 38 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>
              <path d="M 59 10 C 67 11, 74 15, 78 20 C 73 28, 65 33, 57 35 Z" fill="#ff0055"/>
              <circle cx="49" cy="24" r="7" fill="#00e5ff" stroke="#1e293b" stroke-width="2.5"/>
              <circle cx="47" cy="22" r="2.5" fill="#ffffff"/>
            </svg>
          </span>
          <span class="ctrl-label">NİTRO!</span>
        </button>

        <button id="btn-gas" class="ctrl-btn btn-gas" type="button" data-action="gas">
          <span class="pedal-treads" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="ctrl-svg-wrap gas-svg-wrap" aria-hidden="true">
            <svg viewBox="0 0 106 74" class="svg-icon" aria-hidden="true">
              <!-- Beyaz Sticker Kontur -->
              <g stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff">
                <path d="M 10 56 C 6 32, 24 10, 46 6 C 39 22, 50 26, 56 15 C 65 28, 58 52, 40 60 C 25 67, 12 64, 10 56 Z"/>
                <polyline points="63,18 80,35 63,52" fill="none" stroke-width="11"/>
                <polyline points="81,18 98,35 81,52" fill="none" stroke-width="11"/>
              </g>
              <!-- Dev Hot Wheels Alevi -->
              <path d="M 10 56 C 6 32, 24 10, 46 6 C 39 22, 50 26, 56 15 C 65 28, 58 52, 40 60 C 25 67, 12 64, 10 56 Z"
                fill="#ff5500" stroke="#9a2000" stroke-width="2.2" class="flame-tail"/>
              <path d="M 17 53 C 15 37, 27 21, 41 18 C 38 29, 45 32, 50 26 C 54 36, 49 50, 37 55 C 27 59, 19 57, 17 53 Z"
                fill="#ffd000" class="flame-tail"/>
              <path d="M 23 51 C 22 41, 30 32, 38 31 C 41 38, 39 48, 31 51 Z" fill="#ffffff"/>
              <!-- İleri Hız Okları (Kontrastlı Chevrons) -->
              <polyline points="63,18 80,35 63,52" fill="none" stroke="#0e5902" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="63,18 80,35 63,52" fill="none" stroke="#ffea00" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="81,18 98,35 81,52" fill="none" stroke="#0e5902" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="81,18 98,35 81,52" fill="none" stroke="#ff9f1c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="ctrl-label">GAZ!</span>
        </button>
      </div>
    </footer>

    <!-- Duraklatma ve Garaj Seçim Ekranı -->
    <div id="pause-overlay" class="pause-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="pause-card">
        <button id="btn-close-garage" class="garage-close-btn" type="button" aria-label="Garajı Kapat ve Oyuna Dön">
          <svg viewBox="0 0 36 36" class="svg-icon" aria-hidden="true">
            <line x1="9" y1="9" x2="27" y2="27" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
            <line x1="27" y1="9" x2="9" y2="27" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </button>

        <div class="garage-header-badge" aria-hidden="true">
          <svg viewBox="0 0 64 44" class="svg-icon" aria-hidden="true">
            <path d="M 10 36 L 22 8 M 18 10 L 42 15 L 38 28 L 14 23 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
            <polygon points="19,12 29,14 27,20 17,18" fill="#0f172a"/>
            <polygon points="29,20 39,22 37,27 27,25" fill="#0f172a"/>
            <circle cx="46" cy="24" r="12" fill="#ffd000" stroke="#ffffff" stroke-width="3"/>
            <polygon points="46,15 48.5,21 55,21.5 50,25.5 51.5,32 46,28.5 40.5,32 42,25.5 37,21.5 43.5,21" fill="#d97706"/>
          </svg>
        </div>

        <h1 id="pause-title" class="pause-title">CANAVAR ARABALAR GARAJI</h1>
        <p class="pause-subtitle">Arabanı Seç ve Mavi Rampalardan Uçmaya Hazırlan!</p>

        <div class="truck-selector-grid">
          <button id="select-truck-75" class="truck-card card-green selected" type="button" aria-pressed="true">
            <div class="truck-card-top">
              <span class="truck-num-pill num-75">#75</span>
              <span class="truck-select-badge">SEÇİLİ ✓</span>
            </div>
            <div class="truck-preview-stage">
              <canvas id="preview-canvas-75" width="240" height="140"></canvas>
            </div>
            <div class="truck-card-title green-text">#75 FLAME CRUSHER</div>
            <div class="truck-card-tags">
              <span class="spec-tag">Yeşil Alev Gövde</span>
              <span class="spec-tag">Kırmızı Jant</span>
            </div>
          </button>

          <button id="select-truck-18" class="truck-card card-red" type="button" aria-pressed="false">
            <div class="truck-card-top">
              <span class="truck-num-pill num-18">#18</span>
              <span class="truck-select-badge">SEÇ</span>
            </div>
            <div class="truck-preview-stage">
              <canvas id="preview-canvas-18" width="240" height="140"></canvas>
            </div>
            <div class="truck-card-title red-text">#18 GAME RACING</div>
            <div class="truck-card-tags">
              <span class="spec-tag">Kırmızı Yarış Gövde</span>
              <span class="spec-tag">Mavi Jant</span>
            </div>
          </button>
        </div>

        <div class="pause-buttons">
          <button id="btn-resume" class="big-action-btn resume-btn" type="button">
            <span class="big-btn-svg" aria-hidden="true">
              <svg viewBox="0 0 40 40" class="svg-icon" aria-hidden="true">
                <polygon points="10,6 35,20 10,34" fill="#ffffff" stroke="#14532d" stroke-width="2.5" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>OYUNA DEVAM ET!</span>
          </button>

          <button id="btn-spawn-ramp" class="big-action-btn mega-ramp-btn" type="button">

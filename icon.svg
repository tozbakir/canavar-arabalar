<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#091b3a"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0055ff"/>
      <stop offset="100%" stop-color="#00ddff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Blue Ramp -->
  <path d="M50 420 L450 420 L450 250 Q260 350 50 420 Z" fill="url(#ramp)" stroke="#ffffff" stroke-width="10"/>
  <!-- Green Monster Truck #75 -->
  <g transform="translate(230, 195) rotate(-18)">
    <!-- Suspension -->
    <rect x="-85" y="15" width="170" height="24" rx="8" fill="#7a828e" stroke="#222" stroke-width="6"/>
    <!-- Body -->
    <path d="M-110 15 L-105 -25 L-45 -30 L-10 -65 L60 -65 L95 -28 L115 -20 L110 15 Z" fill="#5cd62b" stroke="#183d09" stroke-width="8"/>
    <!-- Window -->
    <path d="M-5 -52 L48 -52 L72 -25 L-28 -25 Z" fill="#1a2634"/>
    <!-- 75 Text -->
    <text x="15" y="6" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#ff7700" stroke="#111" stroke-width="4" text-anchor="middle">75</text>
    <!-- Rear Wheel -->
    <circle cx="-68" cy="52" r="46" fill="#222" stroke="#111" stroke-width="6"/>
    <circle cx="-68" cy="52" r="24" fill="#e61919"/>
    <!-- Front Wheel -->
    <circle cx="68" cy="52" r="46" fill="#222" stroke="#111" stroke-width="6"/>
    <circle cx="68" cy="52" r="24" fill="#e61919"/>
  </g>
</svg>
